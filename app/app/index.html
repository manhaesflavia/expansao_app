<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2B3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Expansão">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Expansão · October 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F8F9;--card:#FFFFFF;--ink:#1F2B3C;--ink2:#6B7480;--rule:#D3D8DE;--accent:#D9A63A;--week:#A3ACB6;--review:#2E5C8A;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
a{color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{border-right:1px solid var(--rule);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--paper)}
nav .brand{font-family:var(--serif);font-size:26px;line-height:1;margin-bottom:2px}
nav .brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-top:6px;font-weight:600}
nav .grp{margin-top:20px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);padding-left:8px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 8px;border-radius:6px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
nav button:hover{background:#eceef1}nav button.on{background:var(--ink);color:#fff}
nav .code{float:right;font-size:10px;letter-spacing:.1em;color:var(--ink2)}nav button.on .code{color:#bbb}
main{padding:34px 48px 80px;max-width:1080px}
h1{font-family:var(--serif);font-weight:500;font-size:40px;margin:0;line-height:1;letter-spacing:.02em}
.sub{margin:8px 0 26px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;font-weight:600}
h3 .hint{font-weight:400;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink2);margin-left:8px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.app{grid-template-columns:1fr}
nav{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:85vw;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 rgba(0,0,0,0);border-right:1px solid var(--rule);padding-top:calc(22px + env(safe-area-inset-top))}
body.menu nav{transform:none;box-shadow:0 0 40px rgba(31,43,60,.25)}
.scrim{display:none;position:fixed;inset:0;background:rgba(31,43,60,.35);z-index:15}body.menu .scrim{display:block}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:10}
.topbar .ham{width:40px;height:40px;border:1px solid var(--rule);border-radius:8px;background:none;font-size:20px;color:var(--ink);cursor:pointer}
.topbar .t{font-family:var(--serif);font-size:20px;letter-spacing:.04em}.topbar .t small{color:var(--accent);font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-left:8px}
main{padding:18px 14px calc(30px + env(safe-area-inset-bottom))}.g2,.g3,.g4{grid-template-columns:1fr}
.daynav button{min-width:40px;height:40px}}
@media(min-width:901px){.topbar,.scrim{display:none}}
.ed{font-size:17px}
.ed{min-height:44px;padding:8px 10px;border:1px dashed transparent;border-radius:6px;white-space:pre-wrap;outline:none;font-size:16px;line-height:1.6}
.ed:empty:before{content:attr(data-ph);color:#a9afb7}
.ed:hover{border-color:var(--rule)}.ed:focus{border-color:var(--ink);background:#fff}
.ed.big{min-height:180px}.ed.mid{min-height:110px}.ed.one{min-height:0}
.chk{list-style:none;padding:0;margin:0;display:grid;gap:8px}.chk.c2{grid-template-columns:1fr 1fr}.chk.c3{grid-template-columns:1fr 1fr 1fr}
.chk li{display:flex;align-items:center;gap:10px;font-size:15px}
.chk li.big{font-family:var(--serif);font-size:22px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink);margin:0}
.chk li.big input{width:26px;height:26px}
.row{display:flex;gap:12px;align-items:center}.row .ed{flex:1}
.n{font-family:var(--serif);color:var(--accent);font-size:26px;width:24px}
table{border-collapse:collapse;width:100%}th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-align:left;color:var(--ink2);padding:6px 8px;font-weight:600}
td{border-top:1px solid var(--rule);padding:4px 6px;vertical-align:top}td .ed{min-height:36px;padding:6px 6px}
td.d{font-family:var(--serif);font-size:20px;width:70px;white-space:nowrap}td.d small{font-family:var(--sans);font-size:10px;letter-spacing:.12em;color:var(--ink2);margin-left:6px}
tr.sun td.d{color:var(--accent)}
.banner{background:var(--review);color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:18px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi .k{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.kpi .k b{display:block;font-family:var(--serif);font-size:34px;line-height:1;font-weight:500}
.kpi .k span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.bar{height:6px;background:#e5e8ec;border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.btn{font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--ink);background:none;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--ink);color:#fff}
.daynav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.daynav button{font:inherit;font-size:12px;width:36px;height:36px;border:1px solid var(--rule);background:#fff;border-radius:6px;cursor:pointer}
.daynav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.daynav button.today{border-color:var(--accent);color:var(--accent)}
.daynav button.on.today{background:var(--accent);color:#fff}
.rule{font-size:14px;color:var(--ink2)}
.tag{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--review);font-weight:600}
.list .item{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--rule);padding:6px 0}.list .item .ed{flex:1}
.list .item .x{background:none;border:0;color:var(--ink2);cursor:pointer;font-size:16px;padding:8px 4px}
.mini{font-size:12px;color:var(--ink2)}
.cards .card{border-left:4px solid var(--accent)}
.chk.c3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 12px}.chk.c3 li{margin:0}
.guide{font-size:15px;line-height:1.55;max-width:820px}.guide h3{color:var(--review);margin:22px 0 6px;font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--rule);padding-bottom:4px}
.guide ol,.guide ul{margin:0;padding-left:22px}.guide li{margin-bottom:5px}.guide li::marker{color:var(--accent)}.guide .ex{color:var(--ink2);font-style:italic}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.app>div{min-width:0}.kpi{grid-template-columns:1fr 1fr;gap:10px}.kpi .k b{font-size:28px}.card{padding:14px}h1{font-size:30px}}
html,body{overflow-x:hidden}
.grid.g2>div{min-width:0}.card{min-width:0}
[data-tip]{position:relative;cursor:help}[data-tip]:hover:after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;white-space:nowrap;z-index:99;pointer-events:none;opacity:0;animation:tipIn .15s forwards}@keyframes tipIn{to{opacity:1}}
.hello{text-align:center;padding:60px 20px 40px}
.hello h1{font-size:52px;margin-bottom:8px}
.hello .greeting{font-size:18px;color:var(--ink2);margin:0 0 40px}
.hello .wins{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.hello .win{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px 24px;min-width:120px;text-align:center}
.hello .win b{display:block;font-family:var(--serif);font-size:42px;line-height:1;font-weight:500;color:var(--accent)}
.hello .win span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.hello .start{margin-top:10px}
.hello .start button{font:inherit;font-size:16px;padding:14px 32px;border:none;border-radius:10px;cursor:pointer;margin:8px;transition:transform .1s}
.hello .start button:hover{transform:scale(1.03)}
.hello .start .primary{background:var(--ink);color:#fff}
.hello .start .secondary{background:var(--card);border:1px solid var(--rule);color:var(--ink)}
.hello .frase{margin-top:36px;font-style:italic;color:var(--ink2);font-size:15px}
.hello .streak{display:inline-block;background:var(--accent);color:#fff;padding:10px 22px;border-radius:30px;font-size:14px;font-weight:600;letter-spacing:.05em;margin:20px 0;animation:popIn .3s ease}
@keyframes popIn{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
.hello .xp{font-family:var(--serif);font-size:64px;font-weight:500;color:var(--accent);line-height:1;margin:10px 0}
.hello .xp-label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.hello .check-done{animation:checkPop .2s ease}@keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.hello .micro{font-size:13px;color:var(--ink2);margin-top:6px}
.daybar{max-width:380px;margin:0 auto 20px;position:relative}
.daybar .track{height:10px;background:#e5e8ec;border-radius:5px;overflow:hidden}
.daybar .fill{height:100%;border-radius:5px;transition:width .5s ease}
.daybar .labels{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2);margin-top:4px;letter-spacing:.08em;text-transform:uppercase}
.daybar .dot{position:absolute;top:-2px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--paper);transform:translateX(-50%);transition:left .5s ease}
@media(max-width:900px){.hello{padding:40px 16px 30px}.hello h1{font-size:36px}.hello .wins{gap:10px}.hello .win{padding:14px 16px;min-width:100px}.hello .win b{font-size:32px}.hello .xp{font-size:48px}}
</style>
</head>
<body>
<div class="app">
<div class="scrim" id="scrim"></div>
<nav>
  <div class="brand">October<br>2026<small>Expansion Sprint 01</small></div>
  <div class="grp">Início</div>
  <button data-v="dash">Dashboard</button>
  <button data-v="today">Hoje <span class="code">D</span></button>
  <button data-v="chaos">Chaos Mode <span class="code">X</span></button>
  <button data-v="capture">Capture It <span class="code">C</span></button>
  <div class="grp">Mês</div>
  <button data-v="overview">Overview <span class="code">O</span></button>
  <button data-v="rmm">RMM <span class="code">M</span></button>
  <button data-v="kpis">KPIs <span class="code">K</span></button>
  <button data-v="backlog">Backlog <span class="code">B</span></button>
  <button data-v="cranes">Guindastes <span class="code">G</span></button>
  <button data-v="acc">Accountability <span class="code">A</span></button>
  <button data-v="glow">Glow Up <span class="code">GU</span></button>
  <button data-v="content">Content <span class="code">CT</span></button>
  <div class="grp">Semanas</div>
  <button data-v="week">Semana <span class="code">W</span></button>
  <div class="grp">Viagem</div>
  <button data-v="checklist">Checklist pre-viagem <span class="code">CV</span></button>
  <button data-v="roma">Roma semana 1 <span class="code">RM</span></button>
  <div class="grp">Review & Lab</div>
  <button data-v="debug">Debug my life <span class="code">DB</span></button>
  <button data-v="lab">System Lab <span class="code">L</span></button>
  <button data-v="route">Route Review <span class="code">R1</span></button>
  <button data-v="monthly">Monthly Review <span class="code">R2</span></button>
  <button data-v="body">Body Review <span class="code">R3</span></button>
  <button data-v="nov">November RMM <span class="code">N</span></button>
  <div class="tools">
    <button class="btn" id="exp">Exportar</button>
    <label class="btn">Importar<input type="file" id="imp" accept="application/json" hidden></label>
  </div>
  <p class="mini" style="margin-top:14px">Salvo automaticamente neste navegador (localStorage). Exporte um JSON de vez em quando.</p>
</nav>
<div><div class="topbar"><button class="ham" id="ham" aria-label="menu">☰</button><span class="t">Expansão<small id="tb-code"></small></span></div><main id="main"></main></div>
</div>
<script>
// ------------------------------------------------------------------ data
const Y=2026,M=10;
const DAYS=[...Array(31)].map((_,i)=>new Date(Y,M-1,i+1));
const WD=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"],WS=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
const SUN=DAYS.filter(d=>d.getDay()===0).map(d=>d.getDate());
const ROUTE=SUN[SUN.length-2],MREV=SUN[SUN.length-1],RMM=27;
const WEEKS=[];{let cur=[];for(const d of DAYS){cur.push(d.getDate());if(d.getDay()===0){WEEKS.push(cur);cur=[]}}if(cur.length)WEEKS.push(cur)}
const weekOf=day=>WEEKS.findIndex(w=>w.includes(day))+1;
const KEY="planner-oct-2026";
let S=JSON.parse(localStorage.getItem(KEY)||"{}");
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const get=(k,def="")=>k in S?S[k]:def;
const set=(k,v)=>{S[k]=v;save()};
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
let today=(now.getFullYear()===Y&&now.getMonth()===M-1)?now.getDate():1;
let curDay=today, curWeek=weekOf(today), view=location.hash.slice(1)||"dash";
const CP=["Manhã","2 Pomodoros","Almoço","Tarde","Fim do trabalho","Noite"];
const ROUT=["leitura (pomodoro)","treino","estudo / idioma","trabalho focado","casa","cachorros passeio","conteúdo","água","sono 7h+","alimentação ok","administrativo"];
const BODY=["água","alimentação","movimento","treino"],LIFE=["cachorros","casa","higiene","administrativo"];

// ------------------------------------------------------------------ widgets
const ed=(k,ph="",cls="")=>`<div class="ed ${cls}" contenteditable data-k="${k}" data-ph="${ph}">${esc(get(k))}</div>`;
const cb=(k,label,big=false)=>`<li class="${big?"big":""}"><input type="checkbox" data-k="${k}" ${get(k,false)?"checked":""}><span>${label}</span></li>`;
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const H=(t,sub="")=>`<h1>${t}</h1><p class="sub">${sub}</p>`;
const box=(t,k,cls="mid",ph="",hint="")=>`<div class="card"><h3>${t}${hint?`<span class="hint">${hint}</span>`:""}</h3>${ed(k,ph,cls)}</div>`;
const numbered=(k,n,ph="")=>[...Array(n)].map((_,i)=>`<div class="row"><span class="n">${i+1}</span>${ed(`${k}.${i}`,ph,"one")}</div>`).join("");
const list=(k,ph)=>{const items=get(k,[]);return `<div class="list" data-list="${k}">${items.map((v,i)=>`<div class="item"><div class="ed one" contenteditable data-list-k="${k}" data-i="${i}" data-ph="${ph}">${esc(v)}</div><button class="x" data-del="${k}" data-i="${i}" title="remover">×</button></div>`).join("")}<button class="btn" data-add="${k}" style="margin-top:10px">+ adicionar</button></div>`};
const table=(k,cols,rows)=>`<table><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>${[...Array(rows)].map((_,r)=>`<tr>${cols.map((c,ci)=>`<td>${c==="✓"?`<input type="checkbox" data-k="${k}.${r}.${ci}" ${get(`${k}.${r}.${ci}`,false)?"checked":""}>`:ed(`${k}.${r}.${ci}`,"","one")}</td>`).join("")}</tr>`).join("")}</table>`;

// ------------------------------------------------------------------ views
const V={};
V.dash=()=>{
  const d=curDay,dd=DAYS[d-1];
  const hora=new Date().getHours();
  const saudacao=hora<12?"Bom dia":hora<18?"Boa tarde":"Boa noite";
  const ALL_H=[["agua","Tomei agua"],["remedio","Tomei remedio"],["cafe","Cafe"],["cachorro","Cachorros"],["banho","Banho"],["almoco","Almocei"],["treino","Treinei"],["foco","Trabalhei focado"],["casa","Algo em casa"],["leitura","Li algo"],["estudo","Estudei"],["conteudo","Criei conteudo"],["alimentacao","Comi bem"],["sono","Dormi 7h+"]];
  let items;
  if(hora<12)items=[["agua","Tomei agua"],["remedio","Remedio"],["cafe","Cafe"],["cachorro","Cachorros"],["banho","Banho"]];
  else if(hora<18)items=[["almoco","Almocei"],["agua","Tomei agua"],["treino","Treinei"],["foco","Trabalhei focado"],["casa","Algo em casa"]];
  else items=[["treino","Treinei"],["leitura","Li algo"],["estudo","Estudei"],["conteudo","Criei conteudo"],["alimentacao","Comi bem"],["sono","Vou dormir 7h+"],["cachorro","Cachorros"]];
  let xpHoje=0;ALL_H.forEach(([k])=>{if(get(`d${d}.h.${k}`,false))xpHoje++});
  [0,1,2].forEach(i=>{if(get(`d${d}.topdone${i}`,false))xpHoje+=3});
  if(get(`d${d}.log`))xpHoje+=2;
  if(get(`d${d}.notes`))xpHoje+=1;
  let xpTotal=0;for(let x=1;x<=31;x++){ALL_H.forEach(([k])=>{if(get(`d${x}.h.${k}`,false))xpTotal++});[0,1,2].forEach(i=>{if(get(`d${x}.topdone${i}`,false))xpTotal+=3});if(get(`d${x}.log`))xpTotal+=2;if(get(`d${x}.notes`))xpTotal+=1}
  let streak=0;for(let x=d;x>=1;x--){let dayXP=0;ALL_H.forEach(([k])=>{if(get(`d${x}.h.${k}`,false))dayXP++});if(dayXP>0)streak++;else break}
  const frases=["Voce esta aqui. Ja e um passo.","Um dia de cada vez.","Feito e melhor que perfeito.","Voce ja fez mais do que imagina.","So a proxima coisa.","Tudo bem recomecar.","Respira. Escolhe uma coisa. Faz.","Progresso nao e linear.","Nao precisa ser perfeito. So precisa ser feito.","Ontem nao importa. Hoje sim.","Cada check e uma vitoria.","Voce ta aqui. Isso conta."];
  const frase=frases[Math.floor(Math.random()*frases.length)];
  const minutos=hora*60+new Date().getMinutes();
  const acordar=7*60,dormir=23*60;
  const totalDia=dormir-acordar;
  const passado=Math.max(0,Math.min(totalDia,minutos-acordar));
  const restante=totalDia-passado;
  const pct=Math.round(restante/totalDia*100);
  const hRest=Math.floor(restante/60);
  const mRest=restante%60;
  const barCor=pct>60?"#4CAF50":pct>30?"#F9A825":"#E53935";
  return `<div class="hello">
    <h1>${saudacao}</h1>
    <p class="greeting">${pad(d)} out · ${WD[dd.getDay()]}</p>
    <div class="daybar">
      <div class="track"><div class="fill" style="width:${pct}%;background:${barCor}"></div></div>
      <div class="dot" style="left:${100-pct}%"></div>
      <div class="labels"><span>${hRest}h${mRest>0?pad(mRest):""} restam</span><span>${hora<12?"manha":hora<18?"tarde":"noite"}</span></div>
    </div>
    <div class="xp">${xpTotal}</div>
    <div class="xp-label">XP total</div>
    ${streak>1?`<div class="streak">${streak} dias seguidos</div>`:""}
    <p class="frase" style="margin:10px 0 24px">${frase}</p>
    <div style="max-width:380px;margin:0 auto">
      <ul class="chk" style="gap:12px;text-align:left">${items.map(([k,label])=>
        `<li class="big"><input type="checkbox" data-k="d${d}.h.${k}" ${get(`d${d}.h.${k}`,false)?"checked":""}><span>${label}</span></li>`
      ).join("")}
      <li class="big"><input type="checkbox" data-k="d${d}.h.outro" ${get(`d${d}.h.outro`,false)?"checked":""}><span style="flex:1">${ed(`d${d}.h.outrotxt`,"outro...","one")}</span></li></ul>
    </div>
    ${hora<12?`<div class="card" style="max-width:380px;margin:20px auto;text-align:left"><h3>Se so der pra fazer 1 coisa hoje</h3>${ed(`d${d}.top0`,"...","one")}</div>`:""}
